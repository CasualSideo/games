<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games Directory</title>
<style>
  :root {
    --bg: #9e9e9e;
    --text: #1a1a1a;
    --link: #1a1a1a;
    --link-hover: #ffffff;
    --heading: #7b1e3a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #4a4a4a;
      --text: #f0f0f0;
      --link: #f0f0f0;
      --link-hover: #ffffff;
      --heading: #ffb74d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #4a4a4a;
    --text: #f0f0f0;
    --link: #f0f0f0;
    --link-hover: #ffffff;
    --heading: #ffb74d;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main { padding: 2rem; }
  h1 { margin: 0 0 2rem; font-size: 4.5rem; font-weight: bold; color: var(--heading); }
  nav { display: flex; flex-direction: column; gap: 1.25rem; }
  a {
    color: var(--link);
    font-size: 1.5rem;
    text-decoration: underline;
    text-underline-offset: 0.25em;
  }
  a:hover, a:focus-visible { color: var(--link-hover); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); text-align: center; }
  footer a { font-size: 0.9rem; }
</style>
</head>
<body>
  <main>
    <h1>games</h1>
    <nav>
      <a href="https://jmcqueen.net/CaveStory">Cave Story</a>
      <a href="https://jmcqueen.net/games/fnaf/index.html">FNAF</a>
      <a href="https://jmcqueen.net/games/terraria/index.html">Terraria</a>
       <a href="https://jmcqueen.net/games/pvz/index.html">Plants vs. Zombies</a>
      <a href="https://jmcqueen.net/games/kindergarden/index.html">Kindergarden</a>
      <a href="https://jmcqueen.net/karlson/index.html">Karlson</a>
      <a href="https://jmcqueen.net/retro">Retro Bowl</a>
      <a href="https://jmcqueen.net/sm64">Super Mario 64</a>
      <a href="https://jmcqueen.net/cookieclicker">Cookie Clicker</a>
      <a href="https://jmcqueen.net/games/snes/index.html">SNES Emulator</a>
    </nav>
  </main>
  <footer>
    <a href="https://jmcqueen.net">home</a>
  </footer>
</body>
</html>
